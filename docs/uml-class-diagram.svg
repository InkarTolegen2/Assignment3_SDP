<marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#333" stroke-width="1.5"/></marker>
</defs>
<rect width="1260" height="700" fill="#fff"/>
<text x="630" y="28" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">Lab Label Printing - Bridge + Adapter (UML class diagram)</text>
<rect x="15" y="45" width="440" height="330" fill="#eef5ff" stroke="#9bb8e6" stroke-dasharray="4,4"/>
<text x="235" y="63" text-anchor="middle" font-size="12" fill="#37588f" >ABSTRACTION hierarchy</text>
<rect x="470" y="45" width="770" height="330" fill="#effaf0" stroke="#9bd6a4" stroke-dasharray="4,4"/>
<text x="855" y="63" text-anchor="middle" font-size="12" fill="#2d6b3a" >IMPLEMENTOR hierarchy</text>
<rect x="40" y="90" width="380" height="150" fill="#dbe9ff" stroke="#333" stroke-width="1.5"/><text x="230.0" y="112" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic">Label</text><line x1="40" y1="120" x2="420" y2="120" stroke="#333"/><text x="48" y="138" font-size="12" font-family="monospace">- printer: LabelPrinter</text><line x1="40" y1="143" x2="420" y2="143" stroke="#333"/><text x="48" y="161" font-size="12" font-family="monospace"># render(): RenderedLabel  {abstract}</text><text x="48" y="178" font-size="12" font-family="monospace">+ print(copies: int): PrintReceipt</text><text x="48" y="195" font-size="12" font-family="monospace">+ printOne(): PrintReceipt</text>
<rect x="25" y="290" width="200" height="58" fill="#dbe9ff" stroke="#333" stroke-width="1.5"/><text x="125.0" y="312" text-anchor="middle" font-size="15" font-weight="bold">SpecimenLabel</text><line x1="25" y1="320" x2="225" y2="320" stroke="#333"/><text x="33" y="338" font-size="12" font-family="monospace"># render(): RenderedLabel</text>
<rect x="245" y="290" width="200" height="58" fill="#dbe9ff" stroke="#333" stroke-width="1.5"/><text x="345.0" y="312" text-anchor="middle" font-size="15" font-weight="bold">ReagentLabel</text><line x1="245" y1="320" x2="445" y2="320" stroke="#333"/><text x="253" y="338" font-size="12" font-family="monospace"># render(): RenderedLabel</text>
<line x1="125" y1="290" x2="200" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#tri)"/>
<line x1="345" y1="290" x2="265" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#tri)"/>
<rect x="520" y="90" width="360" height="80" fill="#d8f3dc" stroke="#333" stroke-width="1.5"/><text x="700.0" y="112" text-anchor="middle" font-size="12" fill="#444">&#171;interface&#187;</text><text x="700.0" y="128" text-anchor="middle" font-size="15" font-weight="bold">LabelPrinter</text><line x1="520" y1="136" x2="880" y2="136" stroke="#333"/><text x="528" y="154" font-size="12" font-family="monospace">+ print(RenderedLabel, int): PrintReceipt</text>
<rect x="490" y="260" width="200" height="58" fill="#d8f3dc" stroke="#333" stroke-width="1.5"/><text x="590.0" y="282" text-anchor="middle" font-size="15" font-weight="bold">ThermalZplPrinter</text><line x1="490" y1="290" x2="690" y2="290" stroke="#333"/><text x="498" y="308" font-size="12" font-family="monospace">+ print(...)</text>
<rect x="710" y="260" width="200" height="58" fill="#d8f3dc" stroke="#333" stroke-width="1.5"/><text x="810.0" y="282" text-anchor="middle" font-size="15" font-weight="bold">FileLabelPrinter</text><line x1="710" y1="290" x2="910" y2="290" stroke="#333"/><text x="718" y="308" font-size="12" font-family="monospace">+ print(...)</text>
<rect x="930" y="260" width="290" height="58" fill="#ffe8b3" stroke="#333" stroke-width="1.5"/><text x="1075.0" y="282" text-anchor="middle" font-size="15" font-weight="bold">DotMatrixPrinterAdapter</text><line x1="930" y1="290" x2="1220" y2="290" stroke="#333"/><text x="938" y="308" font-size="12" font-family="monospace">+ print(...)  // ADAPTER</text>
<line x1="590" y1="260" x2="620" y2="170" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#tri)"/>
<line x1="810" y1="260" x2="740" y2="170" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#tri)"/>
<line x1="1075" y1="260" x2="840" y2="170" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#tri)"/>
<line x1="420" y1="130" x2="520" y2="130" stroke="#333" stroke-width="1.5" marker-start="url(#dia)"/>
<text x="470" y="120" text-anchor="middle" font-size="12" fill="#222" font-style="italic">printer</text>
<text x="470" y="150" text-anchor="middle" font-size="11" fill="#a00" >(the BRIDGE)</text>
<rect x="940" y="90" width="290" height="80" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/><text x="1085.0" y="112" text-anchor="middle" font-size="15" font-weight="bold">PrinterResolver</text><line x1="940" y1="120" x2="1230" y2="120" stroke="#333"/><text x="948" y="138" font-size="12" font-family="monospace">+ register(scheme, factory)</text><text x="948" y="155" font-size="12" font-family="monospace">+ resolve(destination): LabelPrinter</text>
<line x1="940" y1="130" x2="880" y2="130" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#open)"/>
<text x="910" y="120" text-anchor="middle" font-size="11" fill="#222" >&#171;creates&#187;</text>
<rect x="930" y="420" width="290" height="120" fill="#ffe8b3" stroke="#333" stroke-width="1.5"/><text x="1075.0" y="442" text-anchor="middle" font-size="12" fill="#444">&#171;third-party, unmodified&#187;</text><text x="1075.0" y="458" text-anchor="middle" font-size="15" font-weight="bold">DotMatrixDriver</text><line x1="930" y1="466" x2="1220" y2="466" stroke="#333"/><text x="938" y="484" font-size="12" font-family="monospace">+ open() throws DotMatrixLinkException</text><text x="938" y="501" font-size="12" font-family="monospace">+ emit(short, byte[]): int</text><text x="938" y="518" font-size="12" font-family="monospace">+ close()</text><text x="938" y="535" font-size="12" font-family="monospace">codes: 0, -1, -11, -23, -40</text>
<line x1="1075" y1="318" x2="1075" y2="420" stroke="#333" stroke-width="1.5" marker-end="url(#open)"/>
<text x="1130" y="375" text-anchor="middle" font-size="11" fill="#222" >adapts (has-a)</text>
<rect x="490" y="420" width="380" height="120" fill="#fde2e2" stroke="#333" stroke-width="1.5"/><text x="680.0" y="442" text-anchor="middle" font-size="15" font-weight="bold">PrintFailedException</text><line x1="490" y1="450" x2="870" y2="450" stroke="#333"/><text x="498" y="468" font-size="12" font-family="monospace">extends RuntimeException</text><text x="498" y="485" font-size="12" font-family="monospace">Reason: DEVICE_UNAVAILABLE, OUT_OF_MEDIA,</text><text x="498" y="502" font-size="12" font-family="monospace">        INVALID_LABEL, UNSUPPORTED_DESTINATION,</text><text x="498" y="519" font-size="12" font-family="monospace">        UNKNOWN</text>
<line x1="590" y1="318" x2="590" y2="420" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#open)"/>
<line x1="810" y1="318" x2="810" y2="420" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#open)"/>
<line x1="960" y1="318" x2="870" y2="455" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#open)"/>
<text x="700" y="395" text-anchor="middle" font-size="11" fill="#a00" >&#171;throws&#187; (only failure type of the contract)</text>
<rect x="40" y="420" width="380" height="90" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/><text x="230.0" y="442" text-anchor="middle" font-size="12" fill="#444">&#171;data&#187;</text><text x="230.0" y="458" text-anchor="middle" font-size="15" font-weight="bold">Value objects (records)</text><line x1="40" y1="466" x2="420" y2="466" stroke="#333"/><text x="48" y="484" font-size="12" font-family="monospace">RenderedLabel(title, lines, barcode)</text><text x="48" y="501" font-size="12" font-family="monospace">PrintReceipt(copiesPrinted, deviceName)</text>
<text x="30" y="600" text-anchor="start" font-size="12" fill="#222" >Client (Main): printer = resolver.resolve(destination);  new SpecimenLabel(printer, ...).print(2)  - the client never names a concrete printer class.</text>
<text x="30" y="625" text-anchor="start" font-size="12" fill="#222" >Bridge: Label (+ SpecimenLabel, ReagentLabel) varies independently of LabelPrinter (+ Thermal, File, DotMatrixAdapter).</text>
<text x="30" y="650" text-anchor="start" font-size="12" fill="#222" >Adapter: DotMatrixPrinterAdapter converts label + int copies -> ASCII byte[] + short, and status codes / checked exception -> PrintFailedException(Reason).</text>
</svg>